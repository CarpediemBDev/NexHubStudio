spring:
  datasource:
    # H2 Database 연결 설정
    # - jdbc:h2:file:./data/userpop : 파일 모드 (데이터 영구 저장, 현재 설정)
    # - jdbc:h2:mem:userpop : 메모리 모드 (재시작 시 데이터 초기화)
    #
    # MODE=PostgreSQL
    #   운영 DB 는 PostgreSQL 을 보고 있다. 기본 H2 문법으로 짜면 그때 가서
    #   조용히 깨지는 쿼리가 나오므로, 로컬에서도 PostgreSQL 문법으로 검증한다.
    #   (H2 는 PG 호환 모드를 제공한다. SQLite 에는 이런 모드가 없고
    #    동적 타입·DATE 타입 부재 때문에 PG 와 더 멀다)
    #
    # DATABASE_TO_LOWER=TRUE 는 쓰지 않는다.
    #   PostgreSQL 처럼 식별자를 소문자로 접어주지만, Liquibase 가 관리 테이블을
    #   소문자(databasechangelog)로 만들어 놓고 존재 확인은 대문자로 해서
    #   "Table DATABASECHANGELOG already exists" 로 두 번째 기동부터 죽는다.
    #   (첫 기동은 성공하므로 한 번만 띄워보면 못 잡는다)
    #   매퍼는 어차피 따옴표 없는 소문자를 쓰고 H2 가 알아서 접으므로 없어도 동작한다.
    #
    # MODE 를 바꾸면 기존 data/ 파일과 호환되지 않는다 -> data/ 삭제 후 재기동
    # (Liquibase 가 스키마와 시드를 다시 만든다. dev.bat clean 이 이 일을 한다)
    url: jdbc:h2:file:./data/userpop;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console # 접속: http://localhost:8080/h2-console
