spring:
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
    drop-first: false # 개발 시 true로 변경하면 매번 DB 재생성 (주의!)
    default-schema: public
    contexts: development, production
    parameters:
      liquibase.schema: public
      app.name: NexHubStudio-backend
    clear-checksums: false # 최초/프레시 DB 기동 시 DATABASECHANGELOG 미생성 상태에서 clearChecksums UPDATE가 실패하므로 false (changeset 수정 시엔 drop-first 또는 data/ 삭제로 재생성)
